name: README

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  readme:
    name: Rebuild patches list and icons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Pillow
        run: pip install --break-system-packages pillow

      - name: Generate patches list
        run: python3 .github/scripts/generate_patches_readme.py "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" patches-list.json README.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets/icons
          git diff --cached --quiet || (git commit -m "chore: refresh README [skip ci]" && git push)
