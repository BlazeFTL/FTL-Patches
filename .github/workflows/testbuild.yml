- name: Build patches.mpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid

      - name: Stage single file with fixed name
        run: |
          mkdir -p /tmp/out
          cp "$(ls patches/build/libs/patches-*.mpp | head -n1)" /tmp/out/patches.mpp

      - name: Upload raw .mpp (no zip)
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/out/patches.mpp
          archive: false
