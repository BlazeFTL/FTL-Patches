name: Test Build (single patch)

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - test-builds

permissions:
  contents: write

jobs:
  build:
    name: Build patches.mpp
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'sin:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Build patches.mpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid

      # Stage exactly one file with a fixed name:
      # - archive: false fails if the glob matches more than one file
      # - the artifact will be named after this filename (name input is ignored)
      - name: Stage single .mpp with fixed name
        run: |
          mkdir -p /tmp/out
          cp "$(ls patches/build/libs/patches-*.mpp | head -n1)" /tmp/out/patches.mpp

      # Raw upload: UI download button gives you patches.mpp directly, no zip
      - name: Upload raw .mpp artifact (no zip)
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/out/patches.mpp
          archive: false

      - name: Publish raw .mpp to test-builds branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan test-builds-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/out/patches.mpp ./patches-test.mpp
          git add patches-test.mpp
          git commit -m "Test build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin test-builds-tmp:test-builds --force
